  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<body>

<!-- Nav -->
<nav>
  <a href="./index.html" class="nav-logo">LF.</a>
  <div class="nav-tag">Terminal</div>
  <a href="./index.html" class="nav-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar ao portfólio
  </a>
</nav>

<main>

  <!-- Header -->
  <div class="game-header">
    <div class="game-eyebrow">// modo hacker</div>
    <h1 class="game-title">LF <span>Terminal</span></h1>
    <p class="game-sub">Explore meu portfólio por linha de comando · Digite <code>help</code> para começar</p>
  </div>

  <!-- Terminal -->
  <div class="term">
    <div class="term-bar">
      <span class="term-dot r"></span>
      <span class="term-dot y"></span>
      <span class="term-dot g"></span>
      <span class="term-bar-title">felipe@portfolio: ~</span>
    </div>
    <div class="term-body" id="termBody"></div>
  </div>

  <!-- Atalhos (útil no celular) -->
  <div class="chips" id="chips">
    <button class="chip" data-cmd="help">help</button>
    <button class="chip" data-cmd="sobre">sobre</button>
    <button class="chip" data-cmd="skills">skills</button>
    <button class="chip" data-cmd="projetos">projetos</button>
    <button class="chip" data-cmd="contato">contato</button>
    <button class="chip" data-cmd="clear">clear</button>
  </div>

</main>

<footer>
  <p>Feito por <a href="./index.html">Luiz Felipe Nascimento Mota</a> · JavaScript Vanilla · Portfólio LF.</p>
</footer>
